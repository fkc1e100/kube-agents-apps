apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-workload-simple-app
  namespace: default
  labels:
    app: simple-app
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-app
  template:
    metadata:
      labels:
        app: simple-app
    spec:
      containers:
        - name: app
          image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: simple-workload-simple-app
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: simple-app
  ports:
    - port: 80
      targetPort: 8080
