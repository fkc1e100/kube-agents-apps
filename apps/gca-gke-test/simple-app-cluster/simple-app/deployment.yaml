apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-workload-simple-app
  namespace: default
  labels:
    app.kubernetes.io/name: simple-app
    app.kubernetes.io/instance: simple-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-app
      app.kubernetes.io/instance: simple-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simple-app
        app.kubernetes.io/instance: simple-workload
    spec:
      containers:
        - name: simple-app
          image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: simple-workload-simple-app
  namespace: default
  labels:
    app.kubernetes.io/name: simple-app
    app.kubernetes.io/instance: simple-workload
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: simple-app
    app.kubernetes.io/instance: simple-workload
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
