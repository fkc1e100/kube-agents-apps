apiVersion: v1
kind: Namespace
metadata:
  name: kubeagents-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-agents-web-console
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-web-console
    app.kubernetes.io/part-of: kube-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-agents-web-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-web-console
        app.kubernetes.io/part-of: kube-agents
    spec:
      serviceAccountName: kube-agents-web-console
      containers:
        - name: web-console
          image: us-central1-docker.pkg.dev/gca-gke-test/kube-agents-webui/web-console:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PLATFORM_AGENT_ADDR
              value: "http://platform-agent.kubeagents-system.svc.cluster.local:8642"
            - name: LITELLM_ADDR
              value: "http://litellm.kubeagents-system.svc.cluster.local:4000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kube-agents-web-console
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-web-console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-agents-web-console
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
