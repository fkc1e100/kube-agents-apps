apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: kube-agents-web-console
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: STORE_MODEL_IN_DB
              value: "False"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: litellm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
